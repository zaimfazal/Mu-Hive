name: Weekly Scraper

on:
  schedule:
    - cron: "0 15 * * 0" # Every Sunday 8:30 PM IST
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ZULIP_AI_EMAIL: ${{ secrets.ZULIP_AI_EMAIL }}
      ZULIP_AI_KEY: ${{ secrets.ZULIP_AI_KEY }}
      ZULIP_CYBER_SECURITY_EMAIL: ${{ secrets.ZULIP_CYBER_SECURITY_EMAIL }}
      ZULIP_CYBER_SECURITY_KEY: ${{ secrets.ZULIP_CYBER_SECURITY_KEY }}
      ZULIP_WEB_DEVELOPMENT_EMAIL: ${{ secrets.ZULIP_WEB_DEVELOPMENT_EMAIL }}
      ZULIP_WEB_DEVELOPMENT_KEY: ${{ secrets.ZULIP_WEB_DEVELOPMENT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      # 🔍 Debug step (IMPORTANT — remove later if you want)
      - name: Verify environment variables
        run: |
          python - <<EOF
          import os
          required = [
              "DATABASE_URL",
              "GMAIL_APP_PASSWORD",
              "GMAIL_SENDER",
              "GROQ_API_KEY",
              "GROQ_MODEL",
              "TAVILY_API_KEY",
              "ZULIP_AI_EMAIL",
              "ZULIP_AI_KEY",
              "ZULIP_CYBER_SECURITY_EMAIL",
              "ZULIP_CYBER_SECURITY_KEY",
              "ZULIP_WEB_DEVELOPMENT_EMAIL",
              "ZULIP_WEB_DEVELOPMENT_KEY",
          ]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              raise Exception(f"Missing env vars: {missing}")
          print("All environment variables are set ✅")
          EOF

      - name: Run scraper
        run: uv run python main.py
