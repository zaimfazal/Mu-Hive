# Central Interest Group Configuration for Mu-Hive
# Allows adding/modifying IGs without changing code.

interest_groups:
  - id: "ai"
    name: "AI"
    description: "Artificial intelligence, core machine learning, deep neural networks, computer vision, AI agents, foundation models."
    keywords: ["artificial intelligence", " ai ", "ai challenge", "neural network", "deep learning", "computer vision", "ai agent", "autonomous ai", "ai platform", "intelligent system", "machine learning", " ml ", "nlp", "transformer"]
    aliases: ["ai", "artificial intelligence", "ml", "machine learning"]
    search_queries:
      news: ["artificial intelligence AI breakthroughs 2026", "machine learning model releases"]
      hackathons: ["AI machine learning hackathon 2026"]
    negative_indicators: ["malware", "phishing", "ransomware", "semiconductor manufacturing"]
